name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BrowserProfileManager.slnx -c Release

      - name: Test
        run: dotnet test tests/BPM.Core.Tests/BPM.Core.Tests.csproj -c Release --no-build
